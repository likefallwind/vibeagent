[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeagent"
version = "0.1.0"
description = "Project-aware command-line coding agent with safe tools, sessions, and provider-neutral model adapters."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools]
packages = ["vibeagent"]

[project.scripts]
vibeagent = "vibeagent.cli:console_main"
